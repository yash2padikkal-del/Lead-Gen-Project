name: Run Lead-Gen Monitor

run-name: LeadGen Search - ${{ inputs.request_id || 'Scheduled Run' }}

on:
  schedule:
    - cron: "0 6,18 * * *"

  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique frontend search request ID"
        required: false
        type: string
        default: ""
      keyword:
        description: "Keyword to search in Meta Ad Library"
        required: false
        type: string
        default: ""

      search_limit:
        description: "Maximum number of unique brands to process"
        required: false
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
        default: "25"

      request_id:
        description: "Unique ID for this dashboard search"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: leadgen-monitor
  cancel-in-progress: false

jobs:
  run-leadgen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LeadGen
        uses: actions/checkout@v4

      - name: Checkout Facebook scraper
        uses: actions/checkout@v4
        with:
          repository: 2scraper/facebook-ads-scraper
          path: facebook-ads-scraper

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LeadGen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install scraper dependencies
        working-directory: facebook-ads-scraper
        run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Run lead-gen monitor
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          METAPI_API_KEY: ${{ secrets.METAPI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEARCH_KEYWORD: ${{ github.event.inputs.keyword || '' }}
          SEARCH_LIMIT: ${{ github.event.inputs.search_limit || '25' }}
          SEARCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python main.py

      - name: Upload Excel export
        uses: actions/upload-artifact@v4
        with:
          name: leadgen-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/exports/*.xlsx
          if-no-files-found: warn
          retention-days: 7